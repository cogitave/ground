[package]
name = "ground-cli"
version = "0.0.0"
description = "Delivery service for any GitHub repository: merge, trunk validation, incremental CI and release."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ground"
path = "src/lib.rs"

[[bin]]
name = "ground"
path = "src/bin/ground.rs"

[[bin]]
name = "groundd"
path = "src/bin/groundd.rs"

[features]
# Fakes (FakeGitHub, FakeRegistry, FakeClock, MemoryLogger) for tests of this
# crate and of anything built on it. Always compiled under cfg(test).
testing = []

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "net", "io-util", "signal", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
